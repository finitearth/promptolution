# Real HuggingFace dataset. `datasets.load_dataset` returns a Dataset; BaseTask normalizes it to a
# DataFrame via .to_pandas() (duck-typed, so `datasets` stays an optional dependency).
_target_: promptolution.tasks.ClassificationTask
df:
  _target_: datasets.load_dataset
  path: SetFit/ag_news
  split: train[:300]
x_column: text
y_column: label_text
task_description: "Classify the news article into one of: world, sports, business, tech."
eval_strategy: full
