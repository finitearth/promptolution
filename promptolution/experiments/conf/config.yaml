# Top-level experiment config. Pick one option per group (defaults); sweep with -m on the CLI.
# Every group file is a `_target_` + its constructor params (deep instantiate).
defaults:
  - llm: api
  - optimizer: evopromptga
  - task: dummy
  - predictor: marker
  - _self_

n_steps: 3
random_seed: 42
test_frac: 0.2        # held-out fraction for evaluation (0 => evaluate on the train split)
skip_completed: true  # skip a cell whose output dir already has a .finished marker

hydra:
  job:
    chdir: false      # keep cwd stable (library-friendly); output dir is absolute
  run:
    dir: ${oc.env:PROMPTOLUTION_OUTPUT_DIR,outputs}/single/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${oc.env:PROMPTOLUTION_OUTPUT_DIR,outputs}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
