# Top-level experiment config. Pick one option per group (defaults); sweep with -m on the CLI.
# Every group file is a `_target_` + its constructor params.
defaults:
  - llm: api
  - optimizer: capo
  - task: demo
  - predictor: marker
  - _self_

name: ??? # REQUIRED — keys the output folder so a rerun resumes into the SAME folder
meta_llm: null # separate LLM config for prompt proposals; null shares `llm`
n_steps: 10
random_seed: 42
test_frac: 0.2 # held-out fraction for evaluation (0 => evaluate on the train split)
skip_completed: true # skip a cell whose output dir already has a .finished marker (restart)
out_dir: ${hydra:runtime.output_dir} # where this run writes; set by Hydra per run/cell — read it, don't override (overriding splits results from the .hydra/ provenance next to them)

hydra:
  job:
    chdir: false # keep cwd stable (library-friendly); output dir is absolute
    config:
      override_dirname: # the per-cell subdir is the swept-params slug; keep secrets/parent out of it
        exclude_keys: [name, out_dir, llm.api_key, llm.api_url]
  run: # single run -> <root>/<name>
    dir: ${oc.env:PROMPTOLUTION_OUTPUT_DIR,outputs}/${name}
  sweep: # grid -> <root>/<name>/<cell-slug> ; rerun same name skips finished cells
    dir: ${oc.env:PROMPTOLUTION_OUTPUT_DIR,outputs}/${name}
    subdir: ${hydra.job.override_dirname}
