# Real HuggingFace dataset (needs the `datasets` package, part of the `experiment` extra).
df:
  _target_: datasets.load_dataset
  path: SetFit/ag_news
  split: test[:300]     # slice with all 4 classes (train[:300] is 2-class)
x_column: text
y_column: label_text
task_description: "Classify the news article into one of: world, sports, business, tech."
